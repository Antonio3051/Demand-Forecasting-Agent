# Ruff configuration (linter + formatter). Run with:  ruff check .  /  ruff format .
target-version = "py310"
line-length = 100
extend-exclude = [".venv"]

[lint]
# E/W = pycodestyle, F = pyflakes, I = import sorting, UP = modern syntax,
# B = common bugs. A compact, beginner-friendly set.
select = ["E", "W", "F", "I", "UP", "B"]
